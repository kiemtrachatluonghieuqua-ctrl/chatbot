<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>

    <style>

        body{
            font-family: Arial;
            background:#f0f2f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .chat-box{
            width:400px;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        .header{
            background:#0084ff;
            color:white;
            padding:15px;
            text-align:center;
            font-size:20px;
        }

        .messages{
            height:400px;
            padding:10px;
            overflow-y:auto;
        }

        .message{
            margin:10px 0;
            padding:10px;
            border-radius:10px;
            max-width:80%;
        }

        .user{
            background:#0084ff;
            color:white;
            margin-left:auto;
        }

        .bot{
            background:#e4e6eb;
        }

        .input-box{
            display:flex;
            border-top:1px solid #ccc;
        }

        input{
            flex:1;
            padding:15px;
            border:none;
            outline:none;
        }

        button{
            padding:15px;
            border:none;
            background:#0084ff;
            color:white;
            cursor:pointer;
        }

    </style>

</head>
<body>

    <div class="chat-box">

        <div class="header">
            Chatbot
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-box">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
            <button onclick="sendMessage()">Gửi</button>
        </div>

    </div>

<script>

async function sendMessage(){

    const input = document.getElementById("messageInput");

    const message = input.value;

    if(!message) return;

    addMessage(message, "user");

    input.value = "";

    const response = await fetch("/chat", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        message: message
    })
});

    const data = await response.json();

    addMessage(data.reply, "bot");
}

function addMessage(text, sender){

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.classList.add("message");

    div.classList.add(sender);

    if(sender === "bot"){
    div.innerHTML = text;
}else{
    div.innerText = text;
}

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}
document.getElementById("messageInput")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage();
    }

});
</script>

</body>
</html>
